    .badge-blue { background: #eff6ff; color: #2563eb; }

    .badge-neutral { background: #f5f5f5; color: #525252; }
    .gate-box { border: 1px solid #fde68a; background: #fffbeb; border-radius: 6px; padding: 8px; font-size: 11px; }
    .gate-box .gate-title { font-weight: 500; color: #b45309; }
    .gate-box .gate-sub { color: #d97706; margin-top: 2px; }
    .stage-bar { height: 8px; width: 96px; overflow: hidden; border-radius: 4px; background: #e5e5e5; }
    .stage-bar-fill { height: 100%; border-radius: 4px; background: #3b82f6; }
    .cmd-chip { display: inline-flex; border: 1px solid #e5e5e5; background: #fafafa; border-radius: 4px; padding: 4px 8px; font-size: 11px; color: #404040; }
    .evidence-row { display: flex; flex-direction: column; gap: 2px; padding: 6px 0; font-size: 11px; border-bottom: 1px solid #f5f5f5; }
    .evidence-row:last-child { border-bottom: none; }
    .evidence-row-main { display: flex; align-items: center; gap: 8px; }
    .evidence-row-meta { display: flex; flex-wrap: wrap; gap: 8px 12px; padding-left: 20px; font-size: 9px; color: #a3a3a3; }
    .safety-hint { font-size: 9px; margin-top: 6px; }
    .safety-hint-raw { color: #dc2626; }
    .safety-hint-clean { color: #d97706; }
    .source-row { padding: 4px 0; font-size: 11px; }
    a.nav-link { font-size: 12px; color: #737373; padding: 4px 12px; border-radius: 4px; text-decoration: none; }
    a.nav-link.active { font-weight: 500; color: #171717; background: #f5f5f5; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 600px) { .detail-grid { grid-template-columns: 1fr; } }
    .three-pane { display: grid; gap: 12px; }
    @media (min-width: 1024px) { .three-pane { grid-template-columns: 280px minmax(0, 1fr) 300px; } }
    .pane-left { order: 3; }
    .pane-center { order: 1; }
    .pane-right { order: 2; }
    @media (min-width: 1024px) { .pane-left { order: 1; } .pane-center { order: 2; } .pane-right { order: 3; } }
    .flow-node { display: flex; gap: 12px; position: relative; }
    .flow-line { position: absolute; left: 11px; top: 28px; bottom: 0; width: 2px; }
    .flow-dot { position: relative; z-index: 1; flex-shrink: 0; padding-top: 2px; font-size: 16px; }
    .flow-content { min-width: 0; flex: 1; }
    .empty-dashed { border: 1px dashed #e5e5e5; border-radius: 6px; padding: 8px; text-align: center; }
    .empty-dashed p { font-size: 10px; color: #a3a3a3; }
    .cap-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 11px; }

        { title: "2026-Q3 用户留存分析", kind: "daily_analysis", status: "active", stage: "S2.3", slug: "q3-retention", pendingGate: null, latestRunStatus: "running", lockedReportId: null, updatedAt: new Date(Date.now()-3600000).toISOString() },
        { title: "新客转化率提升目标分解", kind: "goal_decomposition", status: "active", stage: "S1.2", slug: "new-customer-conversion", pendingGate: "requirement_confirmation", latestRunStatus: null, lockedReportId: null, updatedAt: new Date(Date.now()-7200000).toISOString() },
        { title: "竞品定价策略研究", kind: "topic_research", status: "completed", stage: "S2.6", slug: "competitor-pricing", pendingGate: null, latestRunStatus: "succeeded", lockedReportId: "lr-123", updatedAt: new Date(Date.now()-86400000*2).toISOString() },
      ];
      let html = `<div style="display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e5e5;padding:8px 16px;"><span style="font-size:11px;color:#737373;">${items.length} 张工单</span><button style="font-size:11px;color:#737373;background:none;border:1px solid #e5e5e5;border-radius:4px;padding:2px 8px;cursor:pointer;">刷新</button></div>`;
      for (const item of items) {
        const pct = businessStageProgress(item.stage);
        const sc = item.status === "active" ? "badge-green" : item.status === "completed" ? "badge-blue" : "badge-neutral";
        const bs = businessStage(item.stage);
        const hint = STAGE_NEXT_HINTS[item.stage];
        let blockerHtml = "";
        if (item.pendingGate) {
          blockerHtml = `<div style="margin-top:4px;font-size:11px;color:#d97706;">等待 ${GATE_TYPE_LABELS[item.pendingGate]} 审核</div>`;
        } else if (item.latestRunStatus === "failed") {
          blockerHtml = `<div style="margin-top:4px;font-size:11px;color:#dc2626;">最近执行失败</div>`;
        } else if (item.latestRunStatus === "blocked") {
          blockerHtml = `<div style="margin-top:4px;font-size:11px;color:#dc2626;">执行已阻塞</div>`;
        }
        let runHtml = "";
        if (item.latestRunStatus === "running") {
          runHtml = `<div style="margin-top:4px;font-size:11px;color:#2563eb;">执行中: ${RUN_STATUS_LABELS[item.latestRunStatus]}</div>`;
        }
        html += `<div style="display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #f5f5f5;">
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${item.title}</span>
              <span class="badge ${sc}">${PROJECT_STATUS_LABELS[item.status]}</span>
              ${item.lockedReportId ? '<span class="badge badge-blue">已锁定</span>' : ''}
            </div>
            <div style="display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11px;color:#737373;">
              <span>${PROJECT_KIND_LABELS[item.kind]}</span><span>·</span>
              <div style="display:flex;align-items:center;gap:6px;"><div class="stage-bar"><div class="stage-bar-fill" style="width:${pct}%"></div></div>${bs ? `<span style="font-size:11px;font-weight:500;color:#404040;">${bs.label}</span>` : ''}<span style="font-size:10px;color:#a3a3a3;">${PROJECT_STAGE_LABELS[item.stage]}</span></div>
            </div>
            ${hint ? `<div style="margin-top:2px;font-size:10px;color:#a3a3a3;">下一步: ${hint}</div>` : ''}
            ${blockerHtml}
            ${runHtml}
          </div>
          <div style="text-align:right;font-size:10px;color:#a3a3a3;white-space:nowrap;"><div>${formatRel(item.updatedAt)}</div><div style="margin-top:2px;">#${item.slug}</div></div>
        </div>`;
      }
      container.innerHTML = html;
    }

    const NODE_COMMANDS = {
      submit: ["request.submit"],
      confirm: ["requirement.generate", "requirement.decide_confirmation", "plan.generate", "plan.decide_confirmation"],
      prepare: [],
      execute: ["run.abort", "run.retry"],
      review: ["report.decide_review"],
      close: ["closure.initiate_cycle", "closure.record_s31_translation", "closure.record_s32_deployment", "closure.record_s33_execution", "closure.append_s34_feedback", "closure.record_s35_evaluation", "closure.record_s36_trigger"],
    };

    function renderFlowTrack(stage, data, opts) {
      const d = data.data;
      const currentBS = businessStage(stage);
      const currentBSIdx = currentBS ? BUSINESS_STAGES.findIndex(b => b.id === currentBS.id) : -1;
      const cmds = d.availableCommands || [];
      const expandedNodes = opts && opts.expandedNodes ? opts.expandedNodes : (currentBS ? [currentBS.id] : []);
      let html = '';
      for (let i = 0; i < BUSINESS_STAGES.length; i++) {
        const bs = BUSINESS_STAGES[i];
        const isDone = i < currentBSIdx;
        const isCurrent = i === currentBSIdx;
        const isLast = i === BUSINESS_STAGES.length - 1;
        const isExpanded = expandedNodes.includes(bs.id);
        const nodeCmdTypes = NODE_COMMANDS[bs.id] || [];
        const nodeCmds = cmds.filter(c => nodeCmdTypes.includes(c.commandType));
        const availCount = nodeCmds.filter(c => c.available).length;
        const totalCount = nodeCmds.length;
        const icon = isDone ? "✅" : isCurrent ? "🕐" : "⚪";
        const textColor = isDone ? "#16a34a" : isCurrent ? "#1e40af" : "#a3a3a3";
        const lineColor = isDone ? "#86efac" : "#e5e5e5";

        html += `<div class="flow-node" style="${isLast ? '' : 'padding-bottom:16px;'}">
          ${!isLast ? `<div class="flow-line" style="background:${lineColor};"></div>` : ''}
          <div class="flow-dot">${icon}</div>
          <div class="flow-content">
            <div style="display:flex;align-items:center;gap:4px;">
              <span style="font-size:13px;color:${textColor};${isCurrent?'font-weight:500;':''}">${bs.label}</span>
              ${!isExpanded && totalCount > 0 ? `<span style="font-size:9px;color:#737373;background:#f5f5f5;border-radius:2px;padding:1px 4px;">${availCount}/${totalCount}</span>` : ''}
              <span style="margin-left:auto;font-size:10px;color:#a3a3a3;">${isExpanded ? '▾' : '▸'}</span>
            </div>
            ${isCurrent ? '<div style="font-size:10px;color:#3b82f6;margin-top:2px;">当前环节</div>' : ''}
            <div style="font-size:10px;color:#a3a3a3;margin-top:2px;">${bs.stages.join(" → ")}</div>`;

        if (isExpanded) {
          html += `<div style="margin-top:8px;border:1px solid #f5f5f5;border-radius:6px;background:#fafafa;padding:8px;">`;
          // Technical stages
          html += `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;">`;
          for (const s of bs.stages) {
            const status = getStageStatus(s, stage);
            const sHint = STAGE_NEXT_HINTS[s];
            const borderC = status === "done" ? "#bbf7d0" : status === "active" ? "#bfdbfe" : "#e5e5e5";
            const bgC = status === "done" ? "#f0fdf4" : status === "active" ? "#eff6ff" : "#fff";
            const sIcon = status === "done" ? "✅" : status === "active" ? "🕐" : "○";
            const sTextColor = status === "done" ? "#16a34a" : status === "active" ? "#1e40af" : "#737373";
            html += `<div style="display:flex;align-items:center;gap:4px;border:1px solid ${borderC};background:${bgC};border-radius:4px;padding:2px 6px;">
              <span style="font-size:10px;">${sIcon}</span>
              <span style="font-size:10px;color:${sTextColor};${status==='active'?'font-weight:500;':''}">${s} ${PROJECT_STAGE_LABELS[s]}</span>
              ${status === "active" && sHint ? `<span style="font-size:9px;color:#3b82f6;">· ${sHint}</span>` : ''}
            </div>`;
          }
          html += `</div>`;

          // Node-specific actions
          html += renderNodeActions(bs.id, d, nodeCmds);

          html += `</div>`;
        }

        html += `</div></div>`;
      }
      return html;
    }

    function renderNodeActions(nodeId, d, nodeCmds) {
      let html = '';
      if (nodeId === "submit") {
        if (d.analysisRequest) {
          html += `<div style="font-size:10px;color:#737373;">需求已提交 · ${formatRel(d.analysisRequest.submittedAt)}${d.analysisRequest.locale ? ' · '+d.analysisRequest.locale : ''}</div>`;
        } else {
          html += `<div style="font-size:10px;color:#a3a3a3;">尚未提交业务需求</div>`;
        }
        for (const cmd of nodeCmds) { html += renderDisabledCmd(cmd); }
      } else if (nodeId === "confirm") {
        html += `<button disabled style="width:100%;border:1px solid #d4d4d4;background:#f5f5f5;border-radius:6px;padding:6px 8px;text-align:left;cursor:not-allowed;font-size:11px;color:#737373;">
          <div style="display:flex;align-items:center;gap:4px;">⚙️ 生成结构化需求</div>
        </button>`;
        if (d.currentRequirement) {
          const v = d.currentRequirement;
          html += `<div style="font-size:10px;color:#737373;margin-top:4px;">当前需求版本: v${v.versionOrdinal} · ${formatRel(v.createdAt)}</div>`;
        }
        if (d.currentPlan) {
          const v = d.currentPlan;
          html += `<div style="font-size:10px;color:#737373;margin-top:2px;">当前计划版本: v${v.versionOrdinal} · ${formatRel(v.createdAt)}</div>`;
        }
        if (d.pendingGate && (d.pendingGate === "requirement_confirmation" || d.pendingGate === "plan_confirmation")) {
          html += `<div style="border:1px solid #fde68a;background:#fffbeb;border-radius:4px;padding:4px 6px;font-size:10px;color:#b45309;margin-top:4px;">${GATE_TYPE_LABELS[d.pendingGate]} · 等待审核决定</div>`;
        }
        for (const cmd of nodeCmds.filter(c => c.commandType !== "requirement.generate")) { html += renderDisabledCmd(cmd); }
      } else if (nodeId === "prepare") {
        const rawEv = (d.inputEvidence || []).filter(ev => ev.safetyClass === "restricted_raw");
        const cleanEv = (d.inputEvidence || []).filter(ev => ev.safetyClass === "controlled");
        html += `<div style="font-size:10px;color:#737373;">原始数据: ${rawEv.length} 项 · 受控数据: ${cleanEv.length} 项</div>`;
        if (!d.inputEvidence || d.inputEvidence.length === 0) {
          html += `<div style="font-size:10px;color:#a3a3a3;">暂无已登记材料</div>`;
        }
      } else if (nodeId === "execute") {
        if (d.latestRun) {
          const r = d.latestRun;
          const rc = r.currentRunStatus === "succeeded" ? "#16a34a" : r.currentRunStatus === "running" ? "#2563eb" : r.currentRunStatus === "failed" ? "#dc2626" : "#737373";
          html += `<div style="display:flex;align-items:center;gap:8px;font-size:10px;">
            <span style="font-weight:500;color:${rc}">${RUN_STATUS_LABELS[r.currentRunStatus] ?? r.currentRunStatus}</span>
            <span style="color:#a3a3a3">Run #${r.runOrdinal}</span>
            <span style="color:#a3a3a3">${PROJECT_STAGE_LABELS[r.currentAnalysisStage] ?? r.currentAnalysisStage}</span>
          </div>`;
        } else {
          html += `<div style="font-size:10px;color:#a3a3a3;">暂无执行记录</div>`;
        }
        for (const cmd of nodeCmds) { html += renderDisabledCmd(cmd); }
      } else if (nodeId === "review") {
        if (d.pendingGate === "report_review") {
          html += `<div style="border:1px solid #fde68a;background:#fffbeb;border-radius:4px;padding:4px 6px;font-size:10px;color:#b45309;margin-bottom:4px;">${GATE_TYPE_LABELS[d.pendingGate]} · 等待审核决定</div>`;
        }
        for (const cmd of nodeCmds) { html += renderDisabledCmd(cmd); }
        if (nodeCmds.length === 0) { html += `<div style="font-size:10px;color:#a3a3a3;">报告审核操作待后续扩展</div>`; }
      } else if (nodeId === "close") {
        html += `<button style="width:100%;border:1px solid #c4b5fd;background:#f5f3ff;border-radius:6px;padding:6px 8px;text-align:left;cursor:pointer;font-size:11px;color:#7c3aed;">进入业务闭合面板</button>`;
        for (const cmd of nodeCmds) { html += renderDisabledCmd(cmd); }
      }
      return html;
    }

    function renderDisabledCmd(cmd) {
      const borderC = cmd.available ? "#bfdbfe" : "#e5e5e5";
      const bgC = cmd.available ? "#eff6ff" : "#fafafa";
      const textC = cmd.available ? "#1e40af" : "#a3a3a3";
      return `<div style="border:1px solid ${borderC};background:${bgC};border-radius:4px;padding:4px 6px;margin-top:4px;font-size:10px;">
        <span style="font-weight:500;color:${textC};">${commandLabel(cmd.commandType)}</span>
        ${!cmd.available && cmd.unavailableReasons && cmd.unavailableReasons.length > 0 ? `<div style="font-size:9px;color:#a3a3a3;margin-top:2px;">${cmd.unavailableReasons[0]}</div>` : ''}
        ${cmd.available ? `<div style="font-size:9px;color:#a3a3a3;margin-top:2px;">API 尚未接入</div>` : ''}
      </div>`;
    }

    function renderDetail(container, data) {
      const d = data.data;
      const p = d.project;
      const currentBS = businessStage(p.stage);
      const bsPct = businessStageProgress(p.stage);
      const hint = STAGE_NEXT_HINTS[p.stage];
      const cmds = d.availableCommands;
      const managementCmds = cmds.filter(c => ["project.update_metadata", "project.delete_draft", "project.cancel", "project.archive"].includes(c.commandType));
      const rawEv = (d.inputEvidence || []).filter(ev => ev.safetyClass === "restricted_raw");
      const cleanEv = (d.inputEvidence || []).filter(ev => ev.safetyClass === "controlled");
      const hasReport = d.latestReport != null || d.lockedReportId != null;

      let html = `<div style="padding:16px;">`;

      // Header
      html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
        <button style="font-size:11px;color:#737373;background:none;border:1px solid #e5e5e5;border-radius:4px;padding:2px 8px;cursor:pointer;">← 返回</button>
        <h2 style="font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.title}</h2>
        <span style="font-size:10px;color:#a3a3a3;">#${p.slug}</span>
        <span style="font-size:10px;color:#525252;background:#f5f5f5;border-radius:2px;padding:1px 6px;">${PROJECT_STATUS_LABELS[p.status] ?? p.status}</span>
        ${managementCmds.length > 0 ? `<div style="margin-left:auto;position:relative;">
          <button style="font-size:11px;color:#737373;background:#fff;border:1px solid #e5e5e5;border-radius:4px;padding:4px 8px;cursor:pointer;">⋮ 更多操作</button>
          <div style="position:absolute;right:0;top:100%;margin-top:4px;width:200px;border:1px solid #e5e5e5;background:#fff;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
            ${managementCmds.map(cmd => `<button disabled style="width:100%;padding:8px 12px;text-align:left;font-size:12px;color:#a3a3a3;background:none;border:none;cursor:not-allowed;border-bottom:1px solid #f5f5f5;">
              <div>${cmd.commandType.replace('project.', '').replace('_', ' ')}</div>
              <div style="font-size:10px;color:#a3a3a3;">当前执行入口未开放</div>
            </button>`).join('')}
          </div>
        </div>` : ''}
      </div>`;

      // Three-pane grid
      html += `<div class="three-pane">`;

      // ── Left pane: Inputs ──
      html += `<div class="pane-left" style="display:flex;flex-direction:column;gap:12px;">`;

      // Uploads
      html += `<div class="section"><div class="section-title">📂 Uploads</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
          <div style="border:1px solid #fecaca;background:#fef2f2;border-radius:6px;padding:8px;text-align:center;">
            <div style="font-size:10px;font-weight:500;color:#dc2626;">010_raw</div>
            <div style="margin-top:4px;font-size:9px;color:#b91c1c;">${rawEv.length > 0 ? rawEv.length+' 项' : '上传'}</div>
          </div>
          <div style="border:1px solid #fde68a;background:#fffbeb;border-radius:6px;padding:8px;text-align:center;">
            <div style="font-size:10px;font-weight:500;color:#d97706;">020_clean</div>
            <div style="margin-top:4px;font-size:9px;color:#b45309;">${cleanEv.length > 0 ? cleanEv.length+' 项' : '上传'}</div>
          </div>
          <div style="border:1px solid #bbf7d0;background:#f0fdf4;border-radius:6px;padding:8px;text-align:center;">
            <div style="font-size:10px;font-weight:500;color:#16a34a;">060_reports</div>
            <div style="margin-top:4px;font-size:9px;color:#15803d;">${hasReport ? '已产出' : '暂无'}</div>
          </div>
        </div>
      </div>`;

      // Raw files
      html += `<div class="section"><div class="section-title">📄 Raw files</div>`;
      if (rawEv.length > 0) {
        html += `<div style="max-height:160px;overflow:auto;">`;
        for (const ev of rawEv) {
          html += `<div class="evidence-row">
            <div class="evidence-row-main">
              <span style="color:#a3a3a3">📄</span>
              <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#404040">${ev.displayName}</span>
              <span class="badge ${SAFETY_COLORS[ev.safetyClass] || 'badge-neutral'}">${SAFETY_LABELS[ev.safetyClass] || ev.safetyClass}</span>
            </div>
            <div class="evidence-row-meta">
              <span>${formatBytes(ev.byteSize)}</span>
              <span style="font-family:monospace;" title="${ev.contentSha256}">sha256:${ev.contentSha256.slice(0,8)}</span>
              <span>${formatRel(ev.createdAt)}</span>
            </div>
          </div>`;
        }
        html += `</div>`;
      } else {
        html += `<div class="empty-dashed"><p>暂无原始数据</p></div>`;
      }
      html += `<div class="safety-hint safety-hint-raw">原始数据仅登记元数据，行级内容不进入 LLM 处理</div>`;
      html += `</div>`;

      // Clean files
      html += `<div class="section"><div class="section-title">📄 Clean files</div>`;
      if (cleanEv.length > 0) {
        html += `<div style="max-height:160px;overflow:auto;">`;
        for (const ev of cleanEv) {
          html += `<div class="evidence-row">
            <div class="evidence-row-main">
              <span style="color:#a3a3a3">📄</span>
              <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#404040">${ev.displayName}</span>
              <span class="badge ${SAFETY_COLORS[ev.safetyClass] || 'badge-neutral'}">${SAFETY_LABELS[ev.safetyClass] || ev.safetyClass}</span>
            </div>
            <div class="evidence-row-meta">
              <span>${formatBytes(ev.byteSize)}</span>
              <span style="font-family:monospace;" title="${ev.contentSha256}">sha256:${ev.contentSha256.slice(0,8)}</span>
              <span>${formatRel(ev.createdAt)}</span>
            </div>
          </div>`;
        }
        html += `</div>`;
      } else {
        html += `<div class="empty-dashed"><p>暂无受控数据</p></div>`;
      }
      html += `<div class="safety-hint safety-hint-clean">受控数据经处理后用于分析流程，需用户知情</div>`;
      html += `</div>`;

      // Business request
      html += `<div class="section"><div class="section-title">📝 Business request</div>`;
      if (d.analysisRequest) {
        const ar = d.analysisRequest;
        html += `<div style="max-height:128px;overflow:auto;background:#fafafa;border-radius:4px;padding:8px;font-size:11px;color:#404040;">${ar.rawRequestText.length > 500 ? ar.rawRequestText.slice(0,500)+'…' : ar.rawRequestText}</div>
          <div style="margin-top:4px;font-size:10px;color:#a3a3a3;">${formatRel(ar.submittedAt)}${ar.locale ? ' · '+ar.locale : ''}</div>`;
      } else {
        html += `<div class="empty-dashed"><p>尚未提交业务需求</p></div>`;
      }
      html += `</div>`;

      // Sources
      if (d.sources && d.sources.length > 0) {
        html += `<div class="section"><div class="section-title">🔗 数据来源</div>`;
        for (const s of d.sources) {
          html += `<div style="display:flex;align-items:flex-start;gap:8px;border:1px solid #f5f5f5;border-radius:4px;padding:6px 8px;margin-bottom:4px;font-size:11px;">
            <span style="color:#a3a3a3;flex-shrink:0;">🔗</span>
            <div style="min-width:0;flex:1;">
              <span style="font-weight:500;color:#404040">${s.displayName}</span>
              <span style="margin-left:8px;font-size:10px;color:#a3a3a3">${s.sourceKind === 'agentharness' ? 'AgentHarness' : '用户上传'}</span>
              ${s.description ? `<div style="font-size:10px;color:#a3a3a3;">${s.description}</div>` : ''}
            </div>
          </div>`;
        }
        html += `</div>`;
      }

      html += `</div>`; // end left pane

      // ── Center pane: Flow ──
      html += `<div class="pane-center" style="display:flex;flex-direction:column;gap:12px;">`;

      // Current stage compact banner
      html += `<div style="border:1px solid #bfdbfe;background:#eff6ff;border-radius:8px;padding:8px 12px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:6px;"><span style="font-size:12px;font-weight:500;color:#1e40af;">🕐 ${currentBS ? currentBS.label : '未知'}</span></div>
          <div style="display:flex;align-items:center;gap:6px;"><div style="height:6px;width:64px;overflow:hidden;border-radius:3px;background:#bfdbfe;"><div style="height:100%;border-radius:3px;background:#2563eb;width:${bsPct}%;"></div></div><span style="font-size:10px;color:#3b82f6;">${bsPct}%</span></div>
        </div>
        ${hint ? `<div style="margin-top:4px;font-size:10px;color:#1d4ed8;">下一步: ${hint}</div>` : ''}
      </div>`;

      // Flow track
      html += `<div class="section"><div class="section-title">🔧 流程路径</div>${renderFlowTrack(p.stage, data)}</div>`;

      // 结构化需求

        <div class="field-row"><span class="field-label">技术状态</span><span class="field-value">${PROJECT_STAGE_LABELS[p.stage] ?? p.stage}</span></div>
        <div class="field-row"><span class="field-label">创建</span><span class="field-value">${formatRel(p.createdAt)}</span></div>
        <div class="field-row"><span class="field-label">更新</span><span class="field-value">${formatRel(p.updatedAt)}</span></div>
      </div>`;
      html += `</div>`; // end right pane

      html += `</div>`; // end three-pane
      html += `</div>`; // end padding
      container.innerHTML = html;
    }

    function commandLabel(cmdType) {
      const labels = {
        "project.update_metadata": "更新信息",
        "project.delete_draft": "删除草稿",
        "project.cancel": "取消项目",
        "project.archive": "归档项目",
        "project.unarchive": "恢复项目",
        "project.reopen": "重新打开",
      };
      return labels[cmdType] ?? cmdType;
    }

    function renderDetailFlowNodes(container, data) {
      const d = data.data;
      const p = d.project;
      const currentBS = businessStage(p.stage);
      const bsPct = businessStageProgress(p.stage);
      const hint = STAGE_NEXT_HINTS[p.stage];

      let html = `<div style="padding:16px;">`;

      // Header
      html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
        <button style="font-size:11px;color:#737373;background:none;border:1px solid #e5e5e5;border-radius:4px;padding:2px 8px;cursor:pointer;">← 返回</button>
        <h2 style="font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.title}</h2>
        <span style="font-size:10px;color:#a3a3a3;">#${p.slug}</span>
        <span style="font-size:10px;color:#525252;background:#f5f5f5;border-radius:2px;padding:1px 6px;">${PROJECT_STATUS_LABELS[p.status] ?? p.status}</span>
      </div>`;

      // Three-pane grid
      html += `<div class="three-pane">`;

      // ── Left pane ──
      html += `<div class="pane-left" style="display:flex;flex-direction:column;gap:12px;">`;
      html += `<div class="section"><div class="section-title">📂 Uploads</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
          <div style="border:1px solid #fecaca;background:#fef2f2;border-radius:6px;padding:8px;text-align:center;">
            <div style="font-size:10px;font-weight:500;color:#dc2626;">010_raw</div>
            <div style="margin-top:4px;font-size:9px;color:#b91c1c;">上传</div>
          </div>
          <div style="border:1px solid #fde68a;background:#fffbeb;border-radius:6px;padding:8px;text-align:center;">
            <div style="font-size:10px;font-weight:500;color:#d97706;">020_clean</div>
            <div style="margin-top:4px;font-size:9px;color:#b45309;">上传</div>
          </div>
          <div style="border:1px solid #bbf7d0;background:#f0fdf4;border-radius:6px;padding:8px;text-align:center;">
            <div style="font-size:10px;font-weight:500;color:#16a34a;">060_reports</div>
            <div style="margin-top:4px;font-size:9px;color:#15803d;">暂无</div>
          </div>
        </div>
      </div>`;
      html += `<div class="section"><div class="section-title">📄 Raw files</div><div class="empty-dashed"><p>暂无原始数据</p></div></div>`;
      html += `<div class="section"><div class="section-title">📄 Clean files</div><div class="empty-dashed"><p>暂无受控数据</p></div></div>`;
      html += `<div class="section"><div class="section-title">📝 Business request</div><div class="empty-dashed"><p>尚未提交业务需求</p></div></div>`;
      html += `</div>`;

      // ── Center pane ──
      html += `<div class="pane-center" style="display:flex;flex-direction:column;gap:12px;">`;
      html += `<div style="border:1px solid #bfdbfe;background:#eff6ff;border-radius:8px;padding:8px 12px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:6px;"><span style="font-size:12px;font-weight:500;color:#1e40af;">🕐 ${currentBS ? currentBS.label : '未知'}</span></div>
          <div style="display:flex;align-items:center;gap:6px;"><div style="height:6px;width:64px;overflow:hidden;border-radius:3px;background:#bfdbfe;"><div style="height:100%;border-radius:3px;background:#2563eb;width:${bsPct}%;"></div></div><span style="font-size:10px;color:#3b82f6;">${bsPct}%</span></div>
        </div>
        ${hint ? `<div style="margin-top:4px;font-size:10px;color:#1d4ed8;">下一步: ${hint}</div>` : ''}
      </div>`;

      // Flow track with multiple nodes expanded (submit + confirm)
      html += `<div class="section"><div class="section-title">🔧 流程路径</div>${renderFlowTrack(p.stage, data, { expandedNodes: ["submit", "confirm"] })}</div>`;

      html += `</div>`;

      // ── Right pane ──
      html += `<div class="pane-right" style="display:flex;flex-direction:column;gap:12px;">`;
      html += `<div class="section"><div class="section-title">📊 Latest report</div><div class="empty-dashed"><p>暂无报告产物</p><p style="margin-top:2px;font-size:9px;">报告由分析执行自动生成</p></div></div>`;
      html += `<div class="section"><div class="section-title">🔒 Locked report</div><div class="empty-dashed"><p>暂无锁定报告</p></div></div>`;
      html += `<div class="section"><div class="section-title">📋 Report versions</div><div class="empty-dashed"><p>版本浏览待扩展</p><p style="margin-top:2px;font-size:9px;">当前仅展示最新版本，多版本浏览待后续实现</p></div></div>`;
      html += `<div class="section"><div class="section-title">🏷️ 项目信息</div>
        <div class="field-row"><span class="field-label">类型</span><span class="field-value">${PROJECT_KIND_LABELS[p.kind] ?? p.kind}</span></div>
        <div class="field-row"><span class="field-label">技术状态</span><span class="field-value">${PROJECT_STAGE_LABELS[p.stage] ?? p.stage}</span></div>
        <div class="field-row"><span class="field-label">创建</span><span class="field-value">${formatRel(p.createdAt)}</span></div>
        <div class="field-row"><span class="field-label">更新</span><span class="field-value">${formatRel(p.updatedAt)}</span></div>
      </div>`;
      html += `</div>`;

      html += `</div>`;
      html += `</div>`;
      container.innerHTML = html;
    }

    // --- ROUTER ---
    const root = document.getElementById("root");
    const mode = new URLSearchParams(window.location.search).get("mode") || "list";

    const toolbar = document.createElement("div");
    toolbar.style.cssText = "display:flex;align-items:center;gap:8px;border-bottom:1px solid #e5e5e5;padding:8px 16px;flex-wrap:wrap;";
    const modes = [
      { id: "list", label: "项目列表" },
      { id: "instructions", label: "使用说明" },
      { id: "detail-gate", label: "详情·需求审核" },
      { id: "detail-plan", label: "详情·计划+执行" },
      { id: "detail-no-materials", label: "详情·无材料" },
      { id: "detail-interactive", label: "详情·交互" },
      { id: "detail-upload", label: "详情·上传面板" },
      { id: "detail-flow-nodes", label: "详情·多节点展开" },
      { id: "detail-with-report", label: "详情·有报告" },
      { id: "capabilities", label: "能力" },
      { id: "closure-list", label: "闭合列表" },
      { id: "closure-detail", label: "闭合详情" },
      { id: "empty", label: "空列表" },
      { id: "noworkspace", label: "无工作区" },
    ];
    toolbar.innerHTML = modes.map(m => `<a href="?mode=${m.id}" class="nav-link ${m.id === mode ? 'active' : ''}">${m.label}</a>`).join("");
    root.appendChild(toolbar);

    const content = document.createElement("div");
    content.style.cssText = "flex:1;overflow:auto;min-height:0;";
    root.appendChild(content);

    if (mode === "empty") renderEmpty(content);
    else if (mode === "noworkspace") renderNoWorkspace(content);
    else if (mode === "instructions") renderInstructions(content);
    else if (mode === "detail-gate") renderDetail(content, FIXTURE_DETAIL);
    else if (mode === "detail-plan") renderDetail(content, FIXTURE_DETAIL_PLAN_GATE);
    else if (mode === "detail-no-materials") renderDetail(content, FIXTURE_DETAIL_NO_MATERIALS);
    else if (mode === "detail-interactive") renderDetailInteractive(content, FIXTURE_DETAIL_INTERACTIVE);
    else if (mode === "detail-upload") renderDetailUploadPanel(content, FIXTURE_DETAIL_UPLOAD_PANEL);
    else if (mode === "detail-flow-nodes") renderDetailFlowNodes(content, FIXTURE_DETAIL);
    else if (mode === "detail-with-report") renderDetail(content, FIXTURE_DETAIL_WITH_REPORT);
    else if (mode === "capabilities") renderCapabilities(content);
    else if (mode === "closure-list") renderClosureList(content);
    else if (mode === "closure-detail") renderClosure(content);
    else renderList(content);
  </script>
</body>
</html>
